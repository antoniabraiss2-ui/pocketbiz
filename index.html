<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#10b981">
  <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/192/10149/10149458.png">
  <title>PocketBiz</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent: #10b981;
      --danger: #ef4444;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
    }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }
    header {
      padding: 16px;
      background-color: var(--card-bg);
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    h1 { margin: 0; font-size: 1.2rem; color: var(--accent); }
    .container { padding: 16px; flex: 1; max-width: 500px; margin: 0 auto; width: 100%; box-sizing: border-box; }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
    }
    .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .stat-title { font-size: 0.8rem; color: var(--text-muted); }
    .stat-value { font-size: 1.4rem; font-weight: bold; margin-top: 4px; }
    .btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      background: var(--accent);
      color: #000;
      font-weight: bold;
      font-size: 1rem;
      cursor: pointer;
      margin-top: 8px;
    }
    .btn-wa { background: #25d366; color: #fff; }
    .form-group { margin-bottom: 12px; text-align: right; }
    label { display: block; font-size: 0.85rem; color: var(--text-muted); margin-bottom: 4px; }
    input {
      width: 100%;
      padding: 10px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--bg-color);
      color: var(--text);
      box-sizing: border-box;
    }
    .nav {
      display: flex;
      justify-content: space-around;
      background: var(--card-bg);
      border-top: 1px solid var(--border);
      padding: 12px 0;
      position: sticky;
      bottom: 0;
    }
    .nav-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 0.85rem;
      cursor: pointer;
    }
    .nav-btn.active { color: var(--accent); font-weight: bold; }
    .tab-content { display: none; }
    .tab-content.active { display: block; }
    .invoice-box {
      border: 1px dashed var(--accent);
      padding: 12px;
      border-radius: 8px;
      margin-top: 12px;
      background: #022c22;
    }
  </style>
</head>
<body>

  <header>
    <h1>POCKETBIZ</h1>
    <span style="font-size: 0.85rem; color: var(--text-muted);">أهلاً بك 👋</span>
  </header>

  <div class="container">
    <div id="tab-home" class="tab-content active">
      <div class="card stats-grid">
        <div>
          <div class="stat-title">مبيعات اليوم</div>
          <div class="stat-value" id="todaySales">$0.00</div>
        </div>
        <div>
          <div class="stat-title">أرباح اليوم</div>
          <div class="stat-value" id="todayProfit" style="color: var(--accent);">$0.00</div>
        </div>
      </div>

      <div class="card">
        <h3 style="margin-top:0;">تسجيل عملية جديدة</h3>
        <div class="form-group">
          <label>اسم الزبون</label>
          <input type="text" id="custName" placeholder="مثلاً: Maria">
        </div>
        <div class="form-group">
          <label>المنتج / الخدمة</label>
          <input type="text" id="prodName" placeholder="مثلاً: Hair treatment">
        </div>
        <div class="form-group">
          <label>التكلفة (Cost $)</label>
          <input type="number" id="prodCost" placeholder="10">
        </div>
        <div class="form-group">
          <label>سعر البيع (Price $)</label>
          <input type="number" id="prodPrice" placeholder="25">
        </div>
        <div class="form-group">
          <label>المبلغ المدفوع ($)</label>
          <input type="number" id="paidAmount" placeholder="20">
        </div>
        <button class="btn" onclick="addSale()">+ حفظ الفاتورة</button>
      </div>

      <div id="invoicePreview" class="card" style="display:none;">
        <h3 style="margin-top:0; color: var(--accent);">🧾 الفاتورة جاهزة</h3>
        <div class="invoice-box" id="invoiceDetails"></div>
        <button class="btn btn-wa" onclick="shareWhatsApp()">📱 مشاركة عبر WhatsApp</button>
      </div>
    </div>

    <div id="tab-customers" class="tab-content">
      <div class="card">
        <h3 style="margin-top:0;">حسابات الزبائن والديون</h3>
        <div id="customersList">لا يوجد زبائن بعد</div>
      </div>
    </div>
  </div>

  <nav class="nav">
    <button class="nav-btn active" onclick="switchTab('home')">الرئيسية</button>
    <button class="nav-btn" onclick="switchTab('customers')">الزبائن والديون</button>
  </nav>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }

    let sales = JSON.parse(localStorage.getItem('pb_sales') || '[]');
    let lastInvoice = null;

    function switchTab(tab) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.nav-btn').forEach(el => el.classList.remove('active'));
      
      if (tab === 'home') {
        document.getElementById('tab-home').classList.add('active');
        event.target.classList.add('active');
      } else {
        document.getElementById('tab-customers').classList.add('active');
        event.target.classList.add('active');
        renderCustomers();
      }
    }

    function updateDashboard() {
      let totalSales = sales.reduce((acc, item) => acc + item.revenue, 0);
      let totalProfit = sales.reduce((acc, item) => acc + item.profit, 0);

      document.getElementById('todaySales').innerText = `$${totalSales.toFixed(2)}`;
      document.getElementById('todayProfit').innerText = `$${totalProfit.toFixed(2)}`;
    }

    function addSale() {
      const customer = document.getElementById('custName').value || 'زبون عام';
      const name = document.getElementById('prodName').value || 'خدمة/منتج';
      const cost = parseFloat(document.getElementById('prodCost').value) || 0;
      const price = parseFloat(document.getElementById('prodPrice').value) || 0;
      const paid = parseFloat(document.getElementById('paidAmount').value) || price;

      const remaining = price - paid;
      const profit = price - cost;

      const saleItem = { customer, name, cost, price, paid, remaining, profit, revenue: price, date: new Date().toLocaleDateString() };
      sales.push(saleItem);
      localStorage.setItem('pb_sales', JSON.stringify(sales));

      lastInvoice = saleItem;

      document.getElementById('invoicePreview').style.display = 'block';
      document.getElementById('invoiceDetails').innerHTML = `
        <b>POCKETBIZ INVOICE</b><br>
        الزبون: ${customer}<br>
        الخدمة: ${name}<br>
        السعر: $${price}<br>
        المدفوع: $${paid}<br>
        <b>المتبقي: $${remaining}</b>
      `;

      document.getElementById('custName').value = '';
      document.getElementById('prodName').value = '';
      document.getElementById('prodCost').value = '';
      document.getElementById('prodPrice').value = '';
      document.getElementById('paidAmount').value = '';

      updateDashboard();
    }

    function shareWhatsApp() {
      if (!lastInvoice) return;
      const text = `🧾 *فاتورة من POCKETBIZ*%0A` +
                   `الزبون: ${lastInvoice.customer}%0A` +
                   `الخدمة/المنتج: ${lastInvoice.name}%0A` +
                   `المبلغ الإجمالي: $${lastInvoice.price}%0A` +
                   `المدفوع: $${lastInvoice.paid}%0A` +
                   `*المتبقي: $${lastInvoice.remaining}*%0A` +
                   `شكراً لتعاملكم معنا ❤️`;
      
      window.open(`https://wa.me/?text=${text}`, '_blank');
    }

    function renderCustomers() {
      let custMap = {};
      sales.forEach(s => {
        if (!custMap[s.customer]) {
          custMap[s.customer] = { total: 0, paid: 0, remaining: 0 };
        }
        custMap[s.customer].total += s.price;
        custMap[s.customer].paid += s.paid;
        custMap[s.customer].remaining += s.remaining;
      });

      let html = '';
      for (let c in custMap) {
        let remColor = custMap[c].remaining > 0 ? 'var(--danger)' : 'var(--accent)';
        html += `<div style="padding: 10px 0; border-bottom: 1px solid var(--border);">
          <b>👤 ${c}</b><br>
          <small style="color: var(--text-muted);">مجموع الحساب: $${custMap[c].total} | المدفوع: $${custMap[c].paid}</small><br>
          <span style="color: ${remColor}; font-weight: bold;">المتبقي: $${custMap[c].remaining}</span>
        </div>`;
      }

      document.getElementById('customersList').innerHTML = html || 'لا يوجد زبائن بعد';
    }

    updateDashboard();
  </script>
</body>
</html>
